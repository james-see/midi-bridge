name: midi-bridge
version: 1.0.0
description: "Send live MIDI events to a local DAW from Hermes Agent. Play notes, chords, drum patterns, control changes, and program changes in real time through any armed instrument track. Uses CoreMIDI (macOS) / ALSA (Linux) via the mido Python library. No cloud, no API keys — everything is local. Ships with genre recipe skills (trap, boom-bap, house, Kanye, Bach, Mozart) so you can say 'play a trap beat' and get the right pattern."
author: "@james-see"
license: MIT
homepage: https://github.com/james-see/midi-bridge
requires_hermes: ">=0.22.0"
provides_tools:
  - send_note
  - send_notes
  - send_cc
  - send_program_change
  - send_pitch_bend
  - play_pattern
  - drum_pattern
  - list_midi_ports
  - set_output
python_dependencies:
  - "mido>=1.3,<2.0"
  - "python-rtmidi>=1.5,<2.0"
  - "numpy>=1.24,<3.0"
config_schema:
  default_channel:
    type: int
    default: 1
    label: "Default MIDI channel"
    description: "MIDI channel for send_note and play_pattern (1-16)"
  default_velocity:
    type: int
    default: 100
    label: "Default velocity"
    description: "Default note velocity (0-127)"
  default_bpm:
    type: int
    default: 120
    label: "Default BPM"
    description: "Default tempo for play_pattern and drum_pattern"
  virtual_port_name:
    type: str
    default: "MIDI Bridge"
    label: "Virtual port name"
    description: "Name of the virtual MIDI port created by the plugin"
